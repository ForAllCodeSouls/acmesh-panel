name: Docker

# 每次推送到 main/master 或打 v* 标签时构建镜像并发布到 GHCR，也可手动触发。
# 使用 GitHub 内置的 GITHUB_TOKEN，不需要额外密钥。
# 镜像地址：ghcr.io/<小写用户名>/<仓库名>

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: 构建并发布镜像到 GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # 从 version.go 读取版本号，保证 push 分支时镜像 tag 也是 0.1.3 而不是 main
      - name: 读取版本
        id: ver
        shell: bash
        run: |
          V="$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+' version.go | head -1)"
          [[ "$V" == v* ]] || V="v$V"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "plain=${V#v}" >> "$GITHUB_OUTPUT"

      # GHCR 只接受小写镜像名；账号名 ForAllCodeSouls 必须转成 forallcodesouls
      - name: 规范化镜像名
        id: img
        shell: bash
        run: |
          echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: 登录 GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ steps.ver.outputs.plain }}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke:
    name: 冒烟测试（镜像能启动并通过健康检查）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 构建测试镜像
        run: docker build -t acmesh-panel:smoke --build-arg VERSION=smoke .

      - name: 启动并检查
        run: |
          docker run -d --name acmesh-panel-smoke -p 127.0.0.1:18081:8080 \
            -e ACME_PANEL_PASSWORD=ci-only-not-a-real-secret \
            -e ACME_PANEL_CRON=0 acmesh-panel:smoke
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18081/api/health >/dev/null; then ok=1; break; fi
            sleep 1
          done
          test "$ok" = "1" || { docker logs acmesh-panel-smoke; exit 1; }
          curl -fsS http://127.0.0.1:18081/api/health | grep -q '"status":"ok"'
          docker logs acmesh-panel-smoke
          docker rm -f acmesh-panel-smoke
