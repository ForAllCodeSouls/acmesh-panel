name: 功能建议
description: 提出新功能或对现有行为的改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 描述使用场景，而不是直接给方案
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 安全 / 认证
        - acme.sh 能力（签发、验证方式、CA）
        - DNS 服务商
        - 证书查看 / 部署
        - UI / 易用性
        - 运维（镜像、编排、备份）
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        注意：多用户 RBAC、Web 终端、任意命令执行、外部数据库在范围之外，
        详见 [CONTRIBUTING.md](../../CONTRIBUTING.md)。
