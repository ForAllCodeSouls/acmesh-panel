# 默认用法：直接拉取 GitHub Actions 构建并发布到 GHCR 的镜像。
# 想从源码本地构建：见 docker-compose.build.yml 和 README「docker compose 使用手册」。

services:
  acmesh-panel:
    image: ghcr.io/forallcodesouls/acmesh-panel:${ACMESH_IMAGE_TAG:-latest}
    container_name: acmesh-panel
    restart: unless-stopped

    # 端口映射：宿主 0.0.0.0:8800 → 容器 8080，改端口只需改冒号左边的数字
    ports:
      - "0.0.0.0:8800:8080"

    # ==========================================================================
    # 环境变量总表（面板读取的全部 env 都在这里，未列出的写了也无效）
    #
    # ⚠ 改任何环境变量后必须执行 `docker compose up -d` 重建容器才会注入新值；
    #   `docker compose restart` 只重启进程、不会刷新环境变量，改了等于没改。
    #   配置值请写在同目录 .env（KEY=value，等号，无引号前缀），compose 只做转发。
    # ==========================================================================
    environment:
      # ---- 必填：账号密码 --------------------------------------------------
      # 密码至少 12 位且同时含大写/小写/数字；必须通过 .env 提供，缺失时 compose 报错
      ACME_PANEL_USER: "${ACME_PANEL_USER:-admin}"
      ACME_PANEL_PASSWORD: "${ACME_PANEL_PASSWORD:?请在 .env 中设置 ACME_PANEL_PASSWORD（至少 12 位）}"

      # ---- 仅允许 HTTPS（HTTP 直连静默断连，等同访问空端口）-----
      # =1 强制开启（HTTP 直连含页面/API 全部断连，/api/health 例外）
      # =0 强制关闭（反代漏传 XFP 把自己锁在外面时的应急恢复）
      # 留空则使用 Web「设置 → 系统运行」里保存的开关（默认关闭）
      # 生效前提：nginx/Caddy 必须向面板透传 X-Forwarded-Proto: https
      # 恢复铁律：设 =0 后要 `docker compose up -d`，restart 不刷新 env
      ACME_PANEL_FORCE_HTTPS: "${ACME_PANEL_FORCE_HTTPS:-}"

      # ---- 应急：重置账号密码 ----------------------------------------------
      # 忘记密码时临时设 1，配合上面的 USER/PASSWORD 重启一次显式重置；用完改回 0
      ACME_PANEL_RESET_CREDENTIALS: "${ACME_PANEL_RESET_CREDENTIALS:-0}"

      # ---- 反代与限流 -------------------------------------------------------
      # 面板固定 HTTP、HTTPS 由反代终结，无 Cookie/HSTS 开关。
      # TRUST_PROXY=1：仅在反代完全可信时开，从 XFF 取真实客户端 IP 做审计/限流
      # TRUST_PROXY_HOPS：XFF 从右往左取第 N 跳（默认 1）
      # 若启用「安全中心 → IP 白名单」且有反代，必须开 TRUST_PROXY，否则白名单看到的是代理 IP
      ACME_PANEL_TRUST_PROXY: "${ACME_PANEL_TRUST_PROXY:-0}"
      ACME_PANEL_TRUST_PROXY_HOPS: "${ACME_PANEL_TRUST_PROXY_HOPS:-1}"

      # ---- 签发与同步 -------------------------------------------------------
      # 自动续期：1 开启（面板内置调度，每 12 小时 acme.sh --cron），0 关闭
      ACME_PANEL_CRON: "${ACME_PANEL_CRON:-1}"
      # 证书同步目录：多个用逗号/分号分隔，留空禁用；需在下方 volumes 挂载同名路径
      ACME_PANEL_SYNC_DIR: "${ACME_PANEL_SYNC_DIR:-}"
      # 同时运行的 acme.sh 任务数，默认 2；低配服务器可设 1
      ACME_PANEL_PARALLEL: "${ACME_PANEL_PARALLEL:-2}"
      # 默认 CA 与 ACME 账号邮箱（也可在 Web 界面里改）
      ACME_PANEL_CA: "${ACME_PANEL_CA:-letsencrypt}"
      ACME_PANEL_EMAIL: "${ACME_PANEL_EMAIL:-}"

      # ---- 高级 / 一般不用改（取消注释即可生效）----------------------------
      # 容器内监听地址，改这里必须同步改上面的 ports 映射
      # ACME_PANEL_LISTEN: "0.0.0.0:8080"
      # acme.sh 脚本与账户密钥目录；改这里必须同步改 volumes
      # ACME_HOME: /acme.sh
      # acme.sh 可执行文件绝对路径；留空自动取 $ACME_HOME/acme.sh
      # ACME_BIN: /acme.sh/acme.sh
      # 面板数据目录：状态、密钥、审计、任务记录；改这里必须同步改 volumes
      # ACME_PANEL_DATA: /data
      # 仅测试用：允许 Webhook 指向私网地址，生产环境请勿开启
      # ACME_PANEL_ALLOW_LOCAL_WEBHOOK: "0"

      TZ: "${TZ:-Asia/Shanghai}"

    volumes:
      - acme_home:/acme.sh   # acme.sh 脚本、证书、账户密钥、续期配置
      - panel_data:/data     # 面板状态：密码哈希、加密凭证、审计日志、部署输出
      # 证书同步：把宿主机目录挂进来，并在 .env 里设 ACME_PANEL_SYNC_DIR=/certs,/srv/ssl
      # - /home/web/certs:/certs
      # - /srv/ssl:/srv/ssl

    # ---- 加固 ----
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    # 仅用于 docker exec -u root chown 修复挂载目录权限；面板进程仍是非 root
    cap_add:
      - CHOWN
    security_opt:
      - no-new-privileges:true

    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  acme_home:
  panel_data:
