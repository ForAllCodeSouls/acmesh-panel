<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="1200" height="700" fill="#f8fafc"/>
  <rect x="40" y="32" width="1120" height="636" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="80" y="90" font-size="32" font-weight="700" fill="#0f172a">DNS 凭证怎么拿、怎么用</text>
  <text x="80" y="128" font-size="18" fill="#475569">选服务商 → 点官网 → 取 Token → 填回面板；签发全程只走 DNS-01</text>

  <!-- 步骤条 -->
  <g>
    <rect x="80" y="170" width="215" height="150" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="104" y="206" font-size="17" font-weight="700" fill="#1e3a8a">① 选服务商</text>
    <text x="104" y="240" font-size="15" fill="#334155">面板下拉里有 43 家</text>
    <text x="104" y="268" font-size="15" fill="#334155">每家都带官网直达链接</text>
    <text x="104" y="296" font-size="14" fill="#64748b">新标签页打开，不丢填写进度</text>

    <rect x="330" y="170" width="215" height="150" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="354" y="206" font-size="17" font-weight="700" fill="#1e3a8a">② 官网生成 Token</text>
    <text x="354" y="240" font-size="15" fill="#334155">登录后找 API / Token 页面</text>
    <text x="354" y="268" font-size="15" fill="#334155">只给 DNS 编辑权限</text>
    <text x="354" y="296" font-size="14" fill="#64748b">复制后妥善保存</text>

    <rect x="580" y="170" width="215" height="150" rx="14" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2"/>
    <text x="604" y="206" font-size="17" font-weight="700" fill="#14532d">③ 填回面板</text>
    <text x="604" y="240" font-size="15" fill="#334155">按字段提示逐项填写</text>
    <text x="604" y="268" font-size="15" fill="#334155">可「保存为凭证」复用</text>
    <text x="604" y="296" font-size="14" fill="#64748b">存储加密，页面只显示掩码</text>

    <rect x="830" y="170" width="290" height="150" rx="14" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2"/>
    <text x="854" y="206" font-size="17" font-weight="700" fill="#14532d">④ 签发 / 续期</text>
    <text x="854" y="240" font-size="15" fill="#334155">acme.sh 用 DNS-01 加一条 TXT 记录</text>
    <text x="854" y="268" font-size="15" fill="#334155">验证完自动删记录、拿证书</text>
    <text x="854" y="296" font-size="14" fill="#64748b">不需要公网 80/443，也不需要停机</text>
  </g>
  <path d="M300 245 L325 245 M550 245 L575 245 M800 245 L825 245" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow2)"/>

  <!-- 三种示例 -->
  <rect x="80" y="360" width="1040" height="260" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="108" y="400" font-size="21" font-weight="700" fill="#0f172a">常见填法示例（均为公开服务商，不含任何真实凭证）</text>

  <rect x="108" y="424" width="310" height="168" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="130" y="458" font-size="18" font-weight="700" fill="#1e40af">Cloudflare</text>
  <text x="130" y="490" font-size="15" fill="#334155">CF_Token = ••••••••••••</text>
  <text x="130" y="518" font-size="15" fill="#334155">CF_Account_ID（可选）</text>
  <text x="130" y="546" font-size="15" fill="#334155">CF_Zone_ID（可选）</text>
  <text x="130" y="574" font-size="14" fill="#64748b">权限：Zone.DNS 编辑</text>

  <rect x="442" y="424" width="310" height="168" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="464" y="458" font-size="18" font-weight="700" fill="#1e40af">DuckDNS</text>
  <text x="464" y="490" font-size="15" fill="#334155">DuckDNS_Token = ••••••••</text>
  <text x="464" y="518" font-size="15" fill="#334155">官网登录后首页可见</text>
  <text x="464" y="546" font-size="15" fill="#334155">填 Token，不是填域名</text>
  <text x="464" y="574" font-size="14" fill="#64748b">适合动态域名场景</text>

  <rect x="776" y="424" width="310" height="168" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="798" y="458" font-size="18" font-weight="700" fill="#1e40af">自建 DNS（RFC2136）</text>
  <text x="798" y="490" font-size="15" fill="#334155">NSUPDATE_SERVER = ns.example.net</text>
  <text x="798" y="518" font-size="15" fill="#334155">NSUPDATE_KEY（TSIG，可选）</text>
  <text x="798" y="546" font-size="15" fill="#334155">NSUPDATE_ZONE（可选）</text>
  <text x="798" y="574" font-size="14" fill="#64748b">无需第三方账号</text>

  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
