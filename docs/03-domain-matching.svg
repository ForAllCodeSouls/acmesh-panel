<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="1200" height="820" fill="#f8fafc"/>
  <rect x="40" y="32" width="1120" height="756" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="80" y="90" font-size="32" font-weight="700" fill="#0f172a">匹配规则：只看证书内容，不看文件名</text>
  <text x="80" y="128" font-size="18" fill="#475569">下面全部用占位域名举例：example.com（注册域 / 俗称一级域名）、www.example.com（子域 / 俗称二级域名）</text>

  <!-- 面板已签发 -->
  <rect x="80" y="164" width="1040" height="112" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="108" y="200" font-size="20" font-weight="700" fill="#1e3a8a">面板已签发的一张证书</text>
  <text x="108" y="236" font-size="17" fill="#1e40af">主域名（CN）：example.com</text>
  <text x="470" y="236" font-size="17" fill="#1e40af">SAN：*.example.com（只覆盖一级子域）</text>
  <text x="870" y="236" font-size="15" fill="#475569">剩余 68 天</text>

  <!-- 对照表头 -->
  <rect x="80" y="304" width="1040" height="42" rx="8" fill="#f1f5f9"/>
  <text x="104" y="332" font-size="16" font-weight="700" fill="#334155">目标机器证书文件里写的域名</text>
  <text x="580" y="332" font-size="16" font-weight="700" fill="#334155">判定</text>
  <text x="780" y="332" font-size="16" font-weight="700" fill="#334155">原因</text>

  <!-- 行 1 -->
  <rect x="80" y="352" width="1040" height="52" rx="8" fill="#f0fdf4"/>
  <text x="104" y="386" font-size="17" fill="#166534">example.com</text>
  <text x="580" y="386" font-size="17" font-weight="700" fill="#15803d">✓ 可同步</text>
  <text x="780" y="386" font-size="15" fill="#334155">与主域名完全一致</text>
  <!-- 行 2 -->
  <rect x="80" y="410" width="1040" height="52" rx="8" fill="#f0fdf4"/>
  <text x="104" y="444" font-size="17" fill="#166534">www.example.com</text>
  <text x="580" y="444" font-size="17" font-weight="700" fill="#15803d">✓ 可同步</text>
  <text x="780" y="444" font-size="15" fill="#334155">被 *.example.com 覆盖（二级域名）</text>
  <!-- 行 3 -->
  <rect x="80" y="468" width="1040" height="52" rx="8" fill="#f0fdf4"/>
  <text x="104" y="502" font-size="17" fill="#166534">api.example.com</text>
  <text x="580" y="502" font-size="17" font-weight="700" fill="#15803d">✓ 可同步</text>
  <text x="780" y="502" font-size="15" fill="#334155">同样是一级子域</text>
  <!-- 行 4 -->
  <rect x="80" y="526" width="1040" height="52" rx="8" fill="#fef2f2"/>
  <text x="104" y="560" font-size="17" fill="#991b1b">deep.api.example.com</text>
  <text x="580" y="560" font-size="17" font-weight="700" fill="#b91c1c">✗ 跳过</text>
  <text x="780" y="560" font-size="15" fill="#334155">通配只盖一层；需另签 *.api.example.com</text>
  <!-- 行 5 -->
  <rect x="80" y="584" width="1040" height="52" rx="8" fill="#fef2f2"/>
  <text x="104" y="618" font-size="17" fill="#991b1b">other.example.net</text>
  <text x="580" y="618" font-size="17" font-weight="700" fill="#b91c1c">✗ 跳过</text>
  <text x="780" y="618" font-size="15" fill="#334155">注册域不同；文件名/host 再像也不算</text>

  <!-- 铁律 -->
  <rect x="80" y="648" width="1040" height="132" rx="14" fill="#fffbeb" stroke="#fde68a" stroke-width="2"/>
  <text x="108" y="682" font-size="18" font-weight="700" fill="#78350f">三条铁律</text>
  <text x="108" y="710" font-size="15" fill="#92400e">1. 比对的是「目标证书自己写的 CN/SAN」与「面板已签发证书的域名」，不是文件名、不是主机名、不是规则名。</text>
  <text x="108" y="738" font-size="15" fill="#92400e">2. 只有匹配上才覆盖，且证书 + 私钥一起写；不匹配的第三方证书原样保留，绝不乱写。</text>
  <text x="108" y="766" font-size="15" fill="#92400e">3. 「类型识别」和「同步资格」是两件事：第三方证书也会被识别标注，但面板没签发就不会同步。</text>
</svg>
